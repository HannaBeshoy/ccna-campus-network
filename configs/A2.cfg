! A2 (WS-C2960-24TT-L) - generated from network.yaml by "python -m campus generate"; edit the YAML, not this file
!
hostname A2
no ip domain-lookup
ip domain-name hu01.test
service password-encryption
enable secret <ENABLE_SECRET>
username admin privilege 15 secret <ADMIN_SECRET>
banner motd ^Authorised access only. HU01 test hall network.^
!
crypto key generate rsa general-keys modulus 2048
ip ssh version 2
ip ssh time-out 60
ip ssh authentication-retries 3
!
line con 0
 logging synchronous
 login local
 exec-timeout 10 0
line vty 0 15
 transport input ssh
 login local
 exec-timeout 10 0
!

spanning-tree mode rapid-pvst
!
vlan 10
 name STAFF
vlan 20
 name PRODUCTION
vlan 30
 name IOT
vlan 40
 name WIFI
vlan 99
 name MGMT
vlan 999
 name PARKING
!
interface range FastEthernet0/21 - 22
 description to D1 (Port-channel13)
 switchport mode trunk
 switchport trunk native vlan 999
 switchport trunk allowed vlan 10,20,30,40,99
 switchport nonegotiate
 channel-group 13 mode active
 no shutdown
interface Port-channel13
 description to D1
 switchport mode trunk
 switchport trunk native vlan 999
 switchport trunk allowed vlan 10,20,30,40,99
 switchport nonegotiate
 ip dhcp snooping trust
 ip arp inspection trust
!
interface range FastEthernet0/23 - 24
 description to D2 (Port-channel14)
 switchport mode trunk
 switchport trunk native vlan 999
 switchport trunk allowed vlan 10,20,30,40,99
 switchport nonegotiate
 channel-group 14 mode active
 no shutdown
interface Port-channel14
 description to D2
 switchport mode trunk
 switchport trunk native vlan 999
 switchport trunk allowed vlan 10,20,30,40,99
 switchport nonegotiate
 ip dhcp snooping trust
 ip arp inspection trust
!
interface FastEthernet0/19
 description unused
 switchport mode access
 switchport access vlan 999
 shutdown
interface FastEthernet0/20
 description unused
 switchport mode access
 switchport access vlan 999
 shutdown
interface GigabitEthernet0/1
 description unused
 switchport mode access
 switchport access vlan 999
 shutdown
interface GigabitEthernet0/2
 description unused
 switchport mode access
 switchport access vlan 999
 shutdown
!

interface Vlan99
 description management
 ip address 10.20.99.12 255.255.255.0
 no shutdown
ip default-gateway 10.20.99.1
!
ip dhcp snooping
ip dhcp snooping vlan 10,20,30,40
! the relay on D1/D2 fills in giaddr; option 82 from this switch would make the IOS DHCP server drop requests
no ip dhcp snooping information option
ip arp inspection vlan 10,20,30,40
ip arp inspection validate src-mac dst-mac ip
!
interface range FastEthernet0/1 - 12
 description test station
 switchport mode access
 switchport access vlan 20
 switchport nonegotiate
 switchport port-security
 switchport port-security maximum 2
 switchport port-security mac-address sticky
 switchport port-security violation restrict
 spanning-tree portfast
 spanning-tree bpduguard enable
 ip dhcp snooping limit rate 10
 no shutdown
!
interface range FastEthernet0/13 - 16
 description ESP32 sensor node
 switchport mode access
 switchport access vlan 30
 switchport nonegotiate
 switchport port-security
 switchport port-security maximum 1
 switchport port-security mac-address sticky
 switchport port-security violation shutdown
 spanning-tree portfast
 spanning-tree bpduguard enable
 ip dhcp snooping limit rate 10
 no shutdown
!
interface range FastEthernet0/17 - 18
 description staff desk
 switchport mode access
 switchport access vlan 10
 switchport nonegotiate
 switchport port-security
 switchport port-security maximum 2
 switchport port-security mac-address sticky
 switchport port-security violation restrict
 spanning-tree portfast
 spanning-tree bpduguard enable
 ip dhcp snooping limit rate 10
 no shutdown
!
end
