! R1 (ISR4331) - generated from network.yaml by "python -m campus generate"; edit the YAML, not this file
!
hostname R1
no ip domain-lookup
ip domain-name hu01.test
service password-encryption
enable secret <ENABLE_SECRET>
username admin privilege 15 secret <ADMIN_SECRET>
banner motd ^Authorised access only. HU01 test hall network.^
!
crypto key generate rsa general-keys modulus 2048
ip ssh version 2
ip ssh time-out 60
ip ssh authentication-retries 3
!
line con 0
 logging synchronous
 login local
 exec-timeout 10 0
line vty 0 4
 transport input ssh
 login local
 exec-timeout 10 0
!

ipv6 unicast-routing
!
ip dhcp excluded-address 10.20.10.1 10.20.10.20
ip dhcp excluded-address 10.20.20.1 10.20.20.20
ip dhcp excluded-address 10.20.30.1 10.20.30.20
ip dhcp excluded-address 10.20.40.1 10.20.40.20
!
ip dhcp pool STAFF
 network 10.20.10.0 255.255.255.0
 default-router 10.20.10.1
 dns-server 10.20.99.53
 domain-name hu01.test
ip dhcp pool PRODUCTION
 network 10.20.20.0 255.255.255.0
 default-router 10.20.20.1
 dns-server 10.20.99.53
 domain-name hu01.test
ip dhcp pool IOT
 network 10.20.30.0 255.255.255.0
 default-router 10.20.30.1
 dns-server 10.20.99.53
 domain-name hu01.test
ip dhcp pool WIFI
 network 10.20.40.0 255.255.255.0
 default-router 10.20.40.1
 dns-server 10.20.99.53
 domain-name hu01.test
ip dhcp pool ESP32-NODE-1
 host 10.20.30.21 255.255.255.0
 hardware-address 0000.0000.0001
 default-router 10.20.30.1
 dns-server 10.20.99.53
!
ipv6 dhcp pool IOT-STATELESS
 dns-server 2001:db8:acad:99::53
 domain-name hu01.test
!
interface Loopback0
 description DHCP server address for the relays
 ip address 10.20.254.1 255.255.255.255
 ipv6 address 2001:db8:acad:254::1/128
!
interface GigabitEthernet0/0/0
 description ISP uplink
 ip address 203.0.113.2 255.255.255.252
 ipv6 address 2001:db8:f::2/64
 no shutdown
!
interface GigabitEthernet0/0/1
 description to D1 G1/0/24
 ip address 10.20.255.1 255.255.255.252
 ipv6 address 2001:db8:acad:ff01::1/64
 ipv6 dhcp server IOT-STATELESS
 no shutdown
!
interface GigabitEthernet0/0/2
 description to D2 G1/0/24
 ip address 10.20.255.5 255.255.255.252
 ipv6 address 2001:db8:acad:ff02::1/64
 ipv6 dhcp server IOT-STATELESS
 no shutdown
!
ip route 0.0.0.0 0.0.0.0 203.0.113.1
ip route 10.20.0.0 255.255.128.0 10.20.255.2
ip route 10.20.0.0 255.255.128.0 10.20.255.6 10
ip route 10.20.99.20 255.255.255.255 10.20.255.6
ipv6 route ::/0 2001:db8:f::1
ipv6 route 2001:db8:acad::/56 2001:db8:acad:ff01::2
ipv6 route 2001:db8:acad::/56 2001:db8:acad:ff02::2 10
!
end
