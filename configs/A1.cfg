! A1 (WS-C2960-24TT-L) - generated from network.yaml by "python -m campus generate"; edit the YAML, not this file
!
hostname A1
no ip domain-lookup
ip domain-name hu01.test
service password-encryption
security passwords min-length 10
login block-for 120 attempts 3 within 60
login on-failure log
login on-success log
enable secret <ENABLE_SECRET>
username admin privilege 15 secret <ADMIN_SECRET>
banner motd ^Authorised access only. HU01 test hall network.^
!
crypto key generate rsa general-keys modulus 2048
ip ssh version 2
ip ssh time-out 60
ip ssh authentication-retries 3
!
line con 0
 logging synchronous
 login local
 exec-timeout 10 0
line vty 0 15
 transport input ssh
 login local
 exec-timeout 10 0
!

spanning-tree mode rapid-pvst
!
vlan 10
 name STAFF
vlan 20
 name PRODUCTION
vlan 30
 name IOT
vlan 40
 name WIFI
vlan 50
 name VOICE
vlan 99
 name MGMT
vlan 999
 name PARKING
!
interface range FastEthernet0/21 - 22
 description to D1 (Port-channel2)
 switchport mode trunk
 switchport trunk native vlan 999
 switchport trunk allowed vlan 10,20,30,40,50,99
 switchport nonegotiate
 speed 100
 duplex full
 ip dhcp snooping trust
 ip arp inspection trust
 channel-group 2 mode active
 no shutdown
interface Port-channel2
 description to D1
 switchport mode trunk
 switchport trunk native vlan 999
 switchport trunk allowed vlan 10,20,30,40,50,99
 switchport nonegotiate
 ip dhcp snooping trust
 ip arp inspection trust
!
interface range FastEthernet0/23 - 24
 description to D2 (Port-channel3)
 switchport mode trunk
 switchport trunk native vlan 999
 switchport trunk allowed vlan 10,20,30,40,50,99
 switchport nonegotiate
 speed 100
 duplex full
 ip dhcp snooping trust
 ip arp inspection trust
 channel-group 3 mode active
 no shutdown
interface Port-channel3
 description to D2
 switchport mode trunk
 switchport trunk native vlan 999
 switchport trunk allowed vlan 10,20,30,40,50,99
 switchport nonegotiate
 ip dhcp snooping trust
 ip arp inspection trust
!
interface GigabitEthernet0/1
 description unused
 switchport mode access
 switchport access vlan 999
 shutdown
interface GigabitEthernet0/2
 description unused
 switchport mode access
 switchport access vlan 999
 shutdown
!

interface Vlan99
 description management
 ip address 10.20.99.11 255.255.255.0
 no shutdown
ip default-gateway 10.20.99.1
!
ip dhcp snooping
ip dhcp snooping vlan 10,20,30,40,50
! the relay on D1/D2 fills in giaddr; option 82 from this switch would make the IOS DHCP server drop requests
no ip dhcp snooping information option
ip arp inspection vlan 10,20,30,40,50
ip arp inspection validate src-mac dst-mac ip
! honour the CoS the IP phones put in the 802.1Q tag of the voice VLAN
mls qos
!
interface range FastEthernet0/1 - 8
 description staff desk, IP phone
 switchport mode access
 switchport access vlan 10
 switchport voice vlan 50
 mls qos trust cos
 switchport nonegotiate
 switchport port-security
 switchport port-security maximum 3
 switchport port-security mac-address sticky
 switchport port-security violation restrict
 spanning-tree portfast
 spanning-tree bpduguard enable
 ip dhcp snooping limit rate 10
 no shutdown
!
interface range FastEthernet0/9 - 16
 description test station
 switchport mode access
 switchport access vlan 20
 switchport nonegotiate
 switchport port-security
 switchport port-security maximum 2
 switchport port-security mac-address sticky
 switchport port-security violation restrict
 spanning-tree portfast
 spanning-tree bpduguard enable
 ip dhcp snooping limit rate 10
 no shutdown
!
interface range FastEthernet0/17 - 18
 description ESP32 sensor node
 switchport mode access
 switchport access vlan 30
 switchport nonegotiate
 switchport port-security
 switchport port-security maximum 1
 switchport port-security mac-address sticky
 switchport port-security violation shutdown
 spanning-tree portfast
 spanning-tree bpduguard enable
 ip dhcp snooping limit rate 10
 no shutdown
!
interface FastEthernet0/19
 description lightweight AP (CAPWAP to the WLC)
 switchport mode access
 switchport access vlan 99
 switchport nonegotiate
 switchport port-security
 switchport port-security maximum 1
 switchport port-security mac-address sticky
 switchport port-security violation restrict
 spanning-tree portfast
 spanning-tree bpduguard enable
 no shutdown
!
interface FastEthernet0/20
 description DNS + RADIUS server
 switchport mode access
 switchport access vlan 99
 switchport nonegotiate
 switchport port-security
 switchport port-security maximum 1
 switchport port-security mac-address sticky
 switchport port-security violation restrict
 spanning-tree portfast
 spanning-tree bpduguard enable
 no shutdown
!
end
