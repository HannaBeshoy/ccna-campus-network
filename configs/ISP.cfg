! ISP (2911) - generated from network.yaml by "python -m campus generate"; edit the YAML, not this file
!
hostname ISP
no ip domain-lookup
ip domain-name hu01.test
service password-encryption
security passwords min-length 10
login block-for 120 attempts 3 within 60
login on-failure log
login on-success log
enable secret <ENABLE_SECRET>
username admin privilege 15 secret <ADMIN_SECRET>
banner motd ^Authorised access only. HU01 test hall network.^
!
crypto key generate rsa general-keys modulus 2048
ip ssh version 2
ip ssh time-out 60
ip ssh authentication-retries 3
!
line con 0
 logging synchronous
 login local
 exec-timeout 10 0
line vty 0 4
 transport input ssh
 login local
 exec-timeout 10 0
!

ipv6 unicast-routing
!
interface GigabitEthernet0/0
 description to R1 (customer HU01)
 ip address 203.0.113.1 255.255.255.252
 ipv6 address 2001:db8:f::1/64
 ipv6 address FE80::A link-local
 no shutdown
!
interface GigabitEthernet0/1
 description Dual Stack Server LAN
 ip address 64.100.1.1 255.255.255.0
 ipv6 address 2001:db8:100:1::1/64
 ipv6 address FE80::1 link-local
 no shutdown
!
! no NAT on the customer side yet (ENSA): routes back to the customer's summaries
ip route 10.20.0.0 255.255.128.0 203.0.113.2
ipv6 route 2001:db8:acad::/56 GigabitEthernet0/0 FE80::1
!
end
