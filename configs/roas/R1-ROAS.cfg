! R1-ROAS (1941) - generated from network.yaml by "python -m campus generate"; edit the YAML, not this file
!
hostname R1-ROAS
no ip domain-lookup
ip domain-name hu01.test
service password-encryption
security passwords min-length 10
login block-for 120 attempts 3 within 60
login on-failure log
login on-success log
enable secret <ENABLE_SECRET>
username admin privilege 15 secret <ADMIN_SECRET>
banner motd ^Authorised access only. HU01 test hall network.^
!
crypto key generate rsa general-keys modulus 2048
ip ssh version 2
ip ssh time-out 60
ip ssh authentication-retries 3
!
line con 0
 logging synchronous
 login local
 exec-timeout 10 0
line vty 0 4
 transport input ssh
 login local
 exec-timeout 10 0
!

ipv6 unicast-routing
!
ip dhcp excluded-address 10.20.10.1 10.20.10.20
ip dhcp excluded-address 10.20.20.1 10.20.20.20
ip dhcp excluded-address 10.20.30.1 10.20.30.20
ip dhcp excluded-address 10.20.40.1 10.20.40.20
ip dhcp excluded-address 10.20.50.1 10.20.50.20
!
! the router is on every subnet, so it serves the pools directly: no relay
ip dhcp pool ROAS-STAFF
 network 10.20.10.0 255.255.255.0
 default-router 10.20.10.1
 dns-server 10.20.99.53
 domain-name hu01.test
ip dhcp pool ROAS-PRODUCTION
 network 10.20.20.0 255.255.255.0
 default-router 10.20.20.1
 dns-server 10.20.99.53
 domain-name hu01.test
ip dhcp pool ROAS-IOT
 network 10.20.30.0 255.255.255.0
 default-router 10.20.30.1
 dns-server 10.20.99.53
 domain-name hu01.test
ip dhcp pool ROAS-WIFI
 network 10.20.40.0 255.255.255.0
 default-router 10.20.40.1
 dns-server 10.20.99.53
 domain-name hu01.test
ip dhcp pool ROAS-VOICE
 network 10.20.50.0 255.255.255.0
 default-router 10.20.50.1
 dns-server 10.20.99.53
 domain-name hu01.test
!
ipv6 dhcp pool ROAS-PRODUCTION
 address prefix 2001:db8:acad:20::/64 lifetime 172800 86400
 dns-server 2001:db8:acad:99::53
 domain-name hu01.test
ipv6 dhcp pool ROAS-STATELESS
 dns-server 2001:db8:acad:99::53
 domain-name hu01.test
!
interface GigabitEthernet0/1
 description 802.1Q trunk to S1-ROAS G0/1 (router-on-a-stick)
 no ip address
 no shutdown
!
interface GigabitEthernet0/1.10
 description STAFF gateway
 encapsulation dot1Q 10
 ip address 10.20.10.1 255.255.255.0
 ipv6 address 2001:db8:acad:10::1/64
 ipv6 address FE80::1 link-local
!
interface GigabitEthernet0/1.20
 description PRODUCTION gateway
 encapsulation dot1Q 20
 ip address 10.20.20.1 255.255.255.0
 ipv6 address 2001:db8:acad:20::1/64
 ipv6 address FE80::1 link-local
 ipv6 nd managed-config-flag
 ipv6 nd prefix default no-autoconfig
 ipv6 dhcp server ROAS-PRODUCTION
!
interface GigabitEthernet0/1.30
 description IOT gateway
 encapsulation dot1Q 30
 ip address 10.20.30.1 255.255.255.0
 ipv6 address 2001:db8:acad:30::1/64
 ipv6 address FE80::1 link-local
 ipv6 nd other-config-flag
 ipv6 dhcp server ROAS-STATELESS
!
interface GigabitEthernet0/1.40
 description WIFI gateway
 encapsulation dot1Q 40
 ip address 10.20.40.1 255.255.255.0
 ipv6 address 2001:db8:acad:40::1/64
 ipv6 address FE80::1 link-local
!
interface GigabitEthernet0/1.50
 description VOICE gateway
 encapsulation dot1Q 50
 ip address 10.20.50.1 255.255.255.0
 ipv6 address 2001:db8:acad:50::1/64
 ipv6 address FE80::1 link-local
!
interface GigabitEthernet0/1.99
 description MGMT gateway
 encapsulation dot1Q 99
 ip address 10.20.99.1 255.255.255.0
 ipv6 address 2001:db8:acad:99::1/64
 ipv6 address FE80::1 link-local
!
interface GigabitEthernet0/1.999
 description native VLAN of the trunk: untagged frames land here, no addresses
 encapsulation dot1Q 999 native
!
end
