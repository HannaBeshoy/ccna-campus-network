! S1-ROAS (WS-C2960-24TT-L) - generated from network.yaml by "python -m campus generate"; edit the YAML, not this file
!
hostname S1-ROAS
no ip domain-lookup
ip domain-name hu01.test
service password-encryption
security passwords min-length 10
login block-for 120 attempts 3 within 60
login on-failure log
login on-success log
enable secret <ENABLE_SECRET>
username admin privilege 15 secret <ADMIN_SECRET>
banner motd ^Authorised access only. HU01 test hall network.^
!
crypto key generate rsa general-keys modulus 2048
ip ssh version 2
ip ssh time-out 60
ip ssh authentication-retries 3
!
line con 0
 logging synchronous
 login local
 exec-timeout 10 0
line vty 0 15
 transport input ssh
 login local
 exec-timeout 10 0
!

spanning-tree mode rapid-pvst
!
vlan 10
 name STAFF
vlan 20
 name PRODUCTION
vlan 30
 name IOT
vlan 40
 name WIFI
vlan 50
 name VOICE
vlan 99
 name MGMT
vlan 999
 name PARKING
!
interface GigabitEthernet0/1
 description 802.1Q trunk to R1-ROAS G0/1 (router-on-a-stick)
 switchport mode trunk
 switchport trunk native vlan 999
 switchport trunk allowed vlan 10,20,30,40,50,99
 switchport nonegotiate
 ip dhcp snooping trust
 ip arp inspection trust
 no shutdown
!
interface Vlan99
 description management
 ip address 10.20.99.13 255.255.255.0
 no shutdown
ip default-gateway 10.20.99.1
!
ip dhcp snooping
ip dhcp snooping vlan 10,20,30,40,50
no ip dhcp snooping information option
ip arp inspection vlan 10,20,30,40,50
ip arp inspection validate src-mac dst-mac ip
mls qos
!
interface range FastEthernet0/1 - 4
 description STAFF, IP phone
 switchport mode access
 switchport access vlan 10
 switchport voice vlan 50
 mls qos trust cos
 switchport nonegotiate
 switchport port-security
 switchport port-security maximum 3
 switchport port-security mac-address sticky
 switchport port-security violation restrict
 spanning-tree portfast
 spanning-tree bpduguard enable
 ip dhcp snooping limit rate 10
 no shutdown
!
interface range FastEthernet0/5 - 8
 description PRODUCTION
 switchport mode access
 switchport access vlan 20
 switchport nonegotiate
 switchport port-security
 switchport port-security maximum 2
 switchport port-security mac-address sticky
 switchport port-security violation restrict
 spanning-tree portfast
 spanning-tree bpduguard enable
 ip dhcp snooping limit rate 10
 no shutdown
!
interface range FastEthernet0/9 - 12
 description IOT
 switchport mode access
 switchport access vlan 30
 switchport nonegotiate
 switchport port-security
 switchport port-security maximum 2
 switchport port-security mac-address sticky
 switchport port-security violation restrict
 spanning-tree portfast
 spanning-tree bpduguard enable
 ip dhcp snooping limit rate 10
 no shutdown
!
interface range FastEthernet0/13 - 16
 description WIFI
 switchport mode access
 switchport access vlan 40
 switchport nonegotiate
 switchport port-security
 switchport port-security maximum 2
 switchport port-security mac-address sticky
 switchport port-security violation restrict
 spanning-tree portfast
 spanning-tree bpduguard enable
 ip dhcp snooping limit rate 10
 no shutdown
!
interface range FastEthernet0/17 - 20
 description MGMT
 switchport mode access
 switchport access vlan 99
 switchport nonegotiate
 switchport port-security
 switchport port-security maximum 2
 switchport port-security mac-address sticky
 switchport port-security violation restrict
 spanning-tree portfast
 spanning-tree bpduguard enable
 no shutdown
!
interface range FastEthernet0/21 - 24
 description unused
 switchport mode access
 switchport access vlan 999
 shutdown
interface GigabitEthernet0/2
 description unused
 switchport mode access
 switchport access vlan 999
 shutdown
!
end
