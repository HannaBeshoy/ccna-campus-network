! D1 (C3650-24PS) - generated from network.yaml by "python -m campus generate"; edit the YAML, not this file
!
hostname D1
no ip domain-lookup
ip domain-name hu01.test
service password-encryption
enable secret <ENABLE_SECRET>
username admin privilege 15 secret <ADMIN_SECRET>
banner motd ^Authorised access only. HU01 test hall network.^
!
crypto key generate rsa general-keys modulus 2048
ip ssh version 2
ip ssh time-out 60
ip ssh authentication-retries 3
!
line con 0
 logging synchronous
 login local
 exec-timeout 10 0
line vty 0 15
 transport input ssh
 login local
 exec-timeout 10 0
!

ip routing
ipv6 unicast-routing
!
spanning-tree mode rapid-pvst
spanning-tree vlan 10,20,99 priority 24576
spanning-tree vlan 30,40 priority 28672
!
vlan 10
 name STAFF
vlan 20
 name PRODUCTION
vlan 30
 name IOT
vlan 40
 name WIFI
vlan 99
 name MGMT
vlan 999
 name PARKING
!
interface range GigabitEthernet1/0/21 - 22
 description to D2 (Port-channel1)
 switchport mode trunk
 switchport trunk native vlan 999
 switchport trunk allowed vlan 10,20,30,40,99
 switchport nonegotiate
 channel-group 1 mode active
 no shutdown
interface Port-channel1
 description to D2
 switchport mode trunk
 switchport trunk native vlan 999
 switchport trunk allowed vlan 10,20,30,40,99
 switchport nonegotiate
!
interface range GigabitEthernet1/0/1 - 2
 description to A1 (Port-channel11)
 switchport mode trunk
 switchport trunk native vlan 999
 switchport trunk allowed vlan 10,20,30,40,99
 switchport nonegotiate
 channel-group 11 mode active
 no shutdown
interface Port-channel11
 description to A1
 switchport mode trunk
 switchport trunk native vlan 999
 switchport trunk allowed vlan 10,20,30,40,99
 switchport nonegotiate
!
interface range GigabitEthernet1/0/3 - 4
 description to A2 (Port-channel13)
 switchport mode trunk
 switchport trunk native vlan 999
 switchport trunk allowed vlan 10,20,30,40,99
 switchport nonegotiate
 channel-group 13 mode active
 no shutdown
interface Port-channel13
 description to A2
 switchport mode trunk
 switchport trunk native vlan 999
 switchport trunk allowed vlan 10,20,30,40,99
 switchport nonegotiate
!
interface range GigabitEthernet1/0/5 - 20
 description unused
 switchport mode access
 switchport access vlan 999
 shutdown
interface GigabitEthernet1/0/23
 description unused
 switchport mode access
 switchport access vlan 999
 shutdown
!

interface GigabitEthernet1/0/24
 description to R1
 no switchport
 ip address 10.20.255.2 255.255.255.252
 ipv6 address 2001:db8:acad:ff01::2/64
 no shutdown
!
interface Vlan10
 description STAFF gateway (HSRP active: D1)
 ip address 10.20.10.2 255.255.255.0
 ipv6 address 2001:db8:acad:10::2/64
 ipv6 address fe80::2 link-local
 standby version 2
 standby 10 ip 10.20.10.1
 standby 10 priority 110
 standby 10 preempt
 standby 1010 ipv6 autoconfig
 standby 1010 priority 110
 standby 1010 preempt
 ip helper-address 10.20.254.1
 no shutdown
!
interface Vlan20
 description PRODUCTION gateway (HSRP active: D1)
 ip address 10.20.20.2 255.255.255.0
 ipv6 address 2001:db8:acad:20::2/64
 ipv6 address fe80::2 link-local
 standby version 2
 standby 20 ip 10.20.20.1
 standby 20 priority 110
 standby 20 preempt
 standby 1020 ipv6 autoconfig
 standby 1020 priority 110
 standby 1020 preempt
 ip helper-address 10.20.254.1
 no shutdown
!
interface Vlan30
 description IOT gateway (HSRP active: D2)
 ip address 10.20.30.2 255.255.255.0
 ipv6 address 2001:db8:acad:30::2/64
 ipv6 address fe80::2 link-local
 standby version 2
 standby 30 ip 10.20.30.1
 standby 30 preempt
 standby 1030 ipv6 autoconfig
 standby 1030 preempt
 ip helper-address 10.20.254.1
 ipv6 nd other-config-flag
 ipv6 dhcp relay destination 2001:db8:acad:254::1
 no shutdown
!
interface Vlan40
 description WIFI gateway (HSRP active: D2)
 ip address 10.20.40.2 255.255.255.0
 ipv6 address 2001:db8:acad:40::2/64
 ipv6 address fe80::2 link-local
 standby version 2
 standby 40 ip 10.20.40.1
 standby 40 preempt
 standby 1040 ipv6 autoconfig
 standby 1040 preempt
 ip helper-address 10.20.254.1
 no shutdown
!
interface Vlan99
 description MGMT gateway (HSRP active: D1)
 ip address 10.20.99.2 255.255.255.0
 ipv6 address 2001:db8:acad:99::2/64
 ipv6 address fe80::2 link-local
 standby version 2
 standby 99 ip 10.20.99.1
 standby 99 priority 110
 standby 99 preempt
 standby 1099 ipv6 autoconfig
 standby 1099 priority 110
 standby 1099 preempt
 no shutdown
!
ip route 0.0.0.0 0.0.0.0 10.20.255.1
ipv6 route ::/0 2001:db8:acad:ff01::1
!
end
