name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements.txt
      - name: The model is consistent
        run: python -m campus check
      - name: The committed configs are exactly what the model generates
        run: |
          python -m campus generate --out configs
          python -m campus plan > docs/ADDRESSING.md
          python -m campus paths > docs/PATHS.md
          python -m campus vlsm > docs/VLSM.md
          python -m campus connectivity > docs/CONNECTIVITY.md
          git diff --exit-code configs docs/ADDRESSING.md docs/PATHS.md docs/VLSM.md docs/CONNECTIVITY.md
      - name: Every config passes the security policy
        run: python -m campus lint configs/*.cfg
      - run: python -m campus stp
      - name: Every VLAN reaches the dual-stack server in every failure scenario
        run: python -m campus paths
      - run: python -m pytest -v tests
